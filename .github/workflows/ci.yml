name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 静态检查（未定义名 / 未使用导入 / 语法）
        run: ruff check .

      - name: 生成合成票据（若仓库未携带）
        run: python -m infra.seed.run fixtures

      - name: 单元与集成测试（内存 SQLite + 进程内 Mock ERP）
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 安装依赖
        run: npm ci --registry=https://registry.npmjs.org

      - name: 类型检查 + 生产构建
        run: npm run build
