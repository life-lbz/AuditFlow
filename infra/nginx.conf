# 粗粒度入口限流（应用内还有按用户 IP 的精细限流）
# 注意：limit_req_zone 只能定义在 http 上下文，conf.d 下的文件正处于该上下文
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# API 后端 upstream：keepalive 复用连接减少握手开销，max_fails 防止雪崩期间反复打坏节点
upstream api_backend {
    server api:8000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# 扩展日志：含限流状态码，方便与应用层 429 做联合排查
log_format auditflow '$remote_addr [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" '
                     'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" '
                     'limit=$limit_req_status';

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log auditflow;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # 容器健康检查（不经过后端）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 前端静态资源缓存（文件名带 hash）；expires 不覆盖上层安全头
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # API 反代：前端以 /api 为基址，这里去掉前缀后转发
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_timeout 5s;
        proxy_next_upstream_tries 3;
        client_max_body_size 25m;
    }

    # 探针直通（运维可直接访问 /healthz 之外的 API 探针）
    location /api/health/live {
        proxy_pass http://api_backend/health/live;
        access_log off;
    }

    location /api/health/ready {
        proxy_pass http://api_backend/health/ready;
        access_log off;
    }

    # SPA 路由回退；index.html 不缓存，保证发布后立即生效
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
