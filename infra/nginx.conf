# 粗粒度入口限流（应用内还有按用户 IP 的精细限流）
# 注意：limit_req_zone 只能定义在 http 上下文，conf.d 下的文件正处于该上下文
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # 容器健康检查（不经过后端）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 前端静态资源缓存（文件名带 hash）；expires 不覆盖上层安全头
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # API 反代：前端以 /api 为基址，这里去掉前缀后转发
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    # 探针直通（运维可直接访问 /healthz 之外的 API 探针）
    location /api/health/live {
        proxy_pass http://api:8000/health/live;
        access_log off;
    }

    # SPA 路由回退；index.html 不缓存，保证发布后立即生效
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
